<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Exercício: Delivery House Burger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            color: #fff;
            margin: 0;
        }

        .delivery-container {
            background: #222;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ffca28;
            /* Amarelo House Burger */
            color: #111;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
        }

        .painel {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            font-weight: bold;
            background-color: #1a1a1a;
            border: 1px solid #444;
        }

        /* Cores dos Passos */
        .buscando {
            color: #00bcd4;
            border-color: #00bcd4;
        }

        /* Ciano */
        .PRODUTO-PRONTO {
            color: #ff9800;
            border-color: #ff9800;
        }

        /* Laranja */
        .saiu-entrega {
            color: #4caf50;
            border-color: #4caf50;
        }

        /* Verde */
        .erro {
            color: #f44336;
            border-color: #f44336;
        }

        /* Vermelho */
    </style>
</head>

<body>

    <div class="delivery-container">
        <h2>Acompanhar Pedido - House Burger</h2>
        <input type="number" id="pedido_input" placeholder="Digite o nº do pedido (ex: 456)">
        <button id="btn_rastrear">Rastrear Pedido</button>

        <div id="status_delivery" class="painel">Aguardando ação...</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
